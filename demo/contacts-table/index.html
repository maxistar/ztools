<!doctype html>
<html>
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>z-contacts-table demo</title>
</head>
<body>
<h1>z-contacts-table</h1>

<z-contacts-table id="t"></z-contacts-table>

<script type="module">
    import "./contacts-table.js";

    const el = document.getElementById("t");

    el.data = [
        { id: "1", name: "Alice", email: "alice@example.com", phone: "+49 111 111" },
        { id: "2", name: "Bob", email: "bob@example.com", phone: "+49 222 222" },
        { id: "3", name: "Clara", email: "clara@example.com", phone: "+49 333 333" }
    ];

    el.addEventListener("rowclick", (e) => console.log("rowclick", e.detail.row));
    el.addEventListener("change", (e) => console.log("change", e.detail));
    el.addEventListener("error", (e) => console.warn("error", e.detail));
</script>
</body>
</html>
