<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>z-donut-chart demo</title>
</head>
<body>
<z-donut-chart id="chart" title="Traffic sources"></z-donut-chart>

<script type="module">
    import "./z-donut-chart.js";

    const chart = document.getElementById("chart");

    const datasetA = [
        { id: "desktop", label: "Desktop", value: 45, color: "#4f46e5" },
        { id: "mobile",  label: "Mobile",  value: 30, color: "#06b6d4" },
        { id: "tablet",  label: "Tablet",  value: 15, color: "#10b981" },
        { id: "other",   label: "Other",   value: 10, color: "#f59e0b" }
    ];

    const datasetB = [
        { id: "desktop", label: "Desktop", value: 25, color: "#4f46e5" },
        { id: "mobile",  label: "Mobile",  value: 50, color: "#06b6d4" },
        { id: "tablet",  label: "Tablet",  value: 12, color: "#10b981" },
        { id: "other",   label: "Other",   value: 13, color: "#f59e0b" }
    ];

    chart.data = datasetA;

    chart.addEventListener("sliceclick", (e) => {
        console.log("slice clicked:", e.detail.slice);
    });

    setTimeout(() => {
        chart.data = datasetB;
    }, 1500);
</script>
</body>
</html>
